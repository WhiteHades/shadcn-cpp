name: Build documentation
on:
  push:
    paths: ['docs/**', 'website/**', 'include/**', 'Doxyfile', 'tools/**', 'upstream/**', 'VERSION', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'website/**', 'include/**', 'Doxyfile', 'tools/**', 'upstream/**', 'VERSION', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y doxygen
      - run: bash tools/build-docs.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-site
          path: website/build
          if-no-files-found: error
      - name: Keep first-build lockfile for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-lockfile
          path: website/package-lock.json
          if-no-files-found: error
