name: Build documentation
on:
  push:
    paths: ['docs/**', 'website/**', 'include/**', 'tools/**', 'upstream/**', 'VERSION', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'website/**', 'include/**', 'tools/**', 'upstream/**', 'VERSION', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y clang clang-tools libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 ninja-build
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: '6.8.3'
          host: linux
          arch: linux_gcc_64
          cache: false
      - run: bash tools/build-docs.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: documentation-site
          path: website/build
          if-no-files-found: error
