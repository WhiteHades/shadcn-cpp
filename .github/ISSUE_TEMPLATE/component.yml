name: Component port
description: Track a source-pinned component increment.
title: "Port: "
body:
  - type: textarea
    id: source
    attributes:
      label: Upstream source
      description: Give the commit, profile, wrapper path and behaviour dependency.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Scope and differences
      description: Name the variants, states and native differences in this increment.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance and evidence
      description: List the build, interaction, visual, animation and accessibility checks.
    validations:
      required: true
