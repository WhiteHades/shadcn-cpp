<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live C++ component</title>
<script>
  const params = new URLSearchParams(location.search);
  const dark = params.get('theme') === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  let loadingTimer;
  function reveal() {
    requestAnimationFrame(() => requestAnimationFrame(() =>
      parent.postMessage('shadcn-preview-ready', location.origin)));
  }
  function previewFailed() {
    clearTimeout(loadingTimer);
    const status = document.getElementById('status');
    status.textContent = 'The live preview could not load. Reload to try again.';
    status.hidden = false;
    reveal();
  }
</script>
<style>
  html, body, #screen { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #fff; color: #171717; font: 14px system-ui, sans-serif; }
  html[data-theme='dark'], html[data-theme='dark'] body { background: #0a0a0a; color: #fafafa; }
  #status { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  #status[hidden] { display: none; }
</style>
<div id="screen"></div>
<div id="status" role="status">Loading C++ preview…</div>
<script src="/shadcn-cpp/live/shadcn_gallery.js" onerror="previewFailed()"></script>
<script src="/shadcn-cpp/live/qtloader.js" onerror="previewFailed()"></script>
<script>
  const status = document.getElementById('status');
  const screen = document.getElementById('screen');
  const args = ['--component', params.get('component') || 'button'];
  if (dark) args.push('--dark');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) args.push('--reduced-motion');
  if (typeof qtLoad !== 'function' || typeof window.shadcn_gallery_entry !== 'function') {
    previewFailed();
  } else {
  loadingTimer = setTimeout(previewFailed, 30000);
  qtLoad({
    arguments: args,
    locateFile: name => `/shadcn-cpp/live/${name}`,
    qt: {
      entryFunction: window.shadcn_gallery_entry,
      containerElements: [screen],
      onLoaded: () => {
        clearTimeout(loadingTimer);
        status.hidden = true;
        reveal();
      },
      onExit: () => { clearTimeout(loadingTimer); status.textContent = 'Preview stopped. Reload to try again.'; status.hidden = false; reveal(); }
    }
  }).then(instance => {
    new ResizeObserver(() => instance.qtResizeContainerElement(screen)).observe(screen);
  }).catch(error => {
    previewFailed();
    console.error(error);
  });
  }
</script>
</html>
